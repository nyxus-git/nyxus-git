name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-snake-dark.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nyxus-git
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#161B22,#3b2369,#5c2d91,#7343b5,#8B5CF6

      - name: Push github-snake-dark.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}